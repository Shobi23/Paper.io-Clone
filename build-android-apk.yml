name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android icon and splash assets
        run: >-
          npx @capacitor/assets generate --android
          --assetPath assets
          --iconBackgroundColor '#f4f1e8'
          --iconBackgroundColorDark '#22232b'
          --splashBackgroundColor '#f4f1e8'
          --splashBackgroundColorDark '#22232b'

      - name: Build signed debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk paper-trail.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paper-Trail-Android-APK
          path: paper-trail.apk
          if-no-files-found: error
          retention-days: 30